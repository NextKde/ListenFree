name: Linux build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 curl tar bzip2 patch util-linux \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools qt6-shadertools-dev qt6-tools-dev qt6-tools-dev-tools \
            libkf6windowsystem-dev libavformat-dev libavcodec-dev libavutil-dev libswresample-dev \
            libcurl4-openssl-dev libpulse-dev libssl-dev zlib1g-dev libicu-dev libsecret-1-dev libutfcpp-dev \
            libqt6sql6-sqlite qml6-module-qtcore qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-templates \
            qml6-module-qtquick-dialogs qml6-module-qtquick-effects qml6-module-qtquick-shapes qml6-module-qttest
      - name: Cooperative controls preserve one slot across headers
        env:
          QT_QPA_PLATFORM: offscreen
        run: /usr/lib/qt6/bin/qmltestrunner -input tests/window-controls
      - name: Installer network and lifecycle regressions
        run: python3 -m unittest discover -s packaging/tests -p test_installer.py -v
      - name: Check the actual Qt and native dependencies
        run: python3 tools/check-dependencies.py --sdk-only
      - name: Prepare checksum-pinned private audio and JS dependencies
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: '4'
        run: ./tools/prepare-listenfree-sdk.sh
      - name: Configure independent root
        run: >-
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF -DLISTENFREE_BUILD_TESTS=OFF
          -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}/listenfree-install"
      - name: Build
        run: cmake --build build/release --parallel 4
      - name: Install
        run: cmake --install build/release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate immutable source release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
          mkdir -p tmp/release
          python3 packaging/prepare-release.py --app listenfree --version "$(tr -d '\n' < VERSION)" --revision "$GITHUB_SHA" --output tmp/release/app-release.json
      - name: Publish reviewed-source release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" tmp/release/app-release.json --verify-tag --title "$RELEASE_TAG" --notes "Independent source release. Use ./install.sh install or Settings. Development dependencies are required; installation never installs system packages and uninstall preserves user data."
